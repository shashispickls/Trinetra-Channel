
<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Trinetra Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#172033;font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif}header{background:#111827;color:#fff;padding:14px}.head{max-width:700px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{width:45px;height:45px;object-fit:contain;background:#fff;border-radius:8px}.brand{display:flex;align-items:center;gap:9px;font-weight:900}main{max-width:700px;margin:auto;padding:16px}.box{background:#fff;border-radius:15px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px #0000000a}h1,h2{margin-top:0}label{display:block;font-weight:800;margin:12px 0 5px}input,textarea,select{width:100%;font:inherit;padding:13px;border:1px solid #d0d5dd;border-radius:10px}textarea{min-height:120px}.btn{width:100%;border:0;border-radius:10px;padding:14px;font:inherit;font-weight:900;margin-top:14px;cursor:pointer}.publish{background:#dc2626;color:#fff}.secondary{background:#e5e7eb;color:#111827}.note{font-size:13px;color:#667085}.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:9px;display:none}.success{background:#dcfce7;color:#166534;padding:12px;border-radius:9px;display:none}
#app{display:none}.logout{color:#fff;background:#374151;padding:9px 12px;border-radius:8px}
</style></head>
<body>
<header><div class="head"><div class="brand"><img class="logo" src="logo.png"><span>TRINETRA ADMIN</span></div><a class="logout" href="index.html">Website</a></div></header>
<main>
<div id="login" class="box"><h1>🔐 Admin Login</h1><p class="note">मोबाइल से खबर प्रकाशित करने के लिए अपना Firebase email/password इस्तेमाल करें।</p><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button class="btn publish" id="loginBtn">Login</button><div id="loginError" class="error"></div></div>
<div id="app">
<div class="box"><h1>📰 नई खबर</h1><label>कैटेगरी</label><select id="category"><option>ताज़ा खबर</option><option>देश</option><option>प्रदेश</option><option>स्थानीय</option><option>राजनीति</option><option>विशेष</option></select><label>हेडलाइन</label><input id="title" placeholder="खबर की मुख्य हेडलाइन"><label>खबर का विवरण</label><textarea id="description" placeholder="खबर का विवरण लिखें..."></textarea><label>फोटो का URL (वैकल्पिक)</label><input id="imageUrl" placeholder="https://..."><button class="btn publish" id="publishBtn">🔴 Publish News</button><div id="success" class="success"></div><div id="publishError" class="error"></div></div>
<div class="box"><h2>ℹ️ Mobile workflow</h2><p class="note">Login → Category चुनें → Headline/Description लिखें → फोटो URL डालें → Publish. Publish होते ही connected website पर खबर दिखाई जाएगी।</p></div>
</div>
</main>
<script>
window.TRINETRA_FIREBASE_CONFIG = null;
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const cfg=window.TRINETRA_FIREBASE_CONFIG;
const login=document.getElementById("login"), appBox=document.getElementById("app");
if(!cfg){
 document.getElementById("loginError").style.display="block";
 document.getElementById("loginError").textContent="Firebase configuration अभी जोड़नी है। Website को online publishing के लिए Firebase project से connect करना होगा।";
 document.getElementById("loginBtn").disabled=true;
}else{
 const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
 onAuthStateChanged(auth,user=>{login.style.display=user?"none":"block";appBox.style.display=user?"block":"none"});
 document.getElementById("loginBtn").onclick=async()=>{
  try{await signInWithEmailAndPassword(auth,email.value,password.value);loginError.style.display="none"}catch(e){loginError.style.display="block";loginError.textContent="Login failed: "+e.message}
 };
 document.getElementById("publishBtn").onclick=async()=>{
  const err=document.getElementById("publishError"),ok=document.getElementById("success");
  err.style.display="none";ok.style.display="none";
  if(!title.value.trim()||!description.value.trim()){err.textContent="Headline और विवरण भरना जरूरी है।";err.style.display="block";return}
  try{
   await addDoc(collection(db,"news"),{category:category.value,title:title.value.trim(),description:description.value.trim(),imageUrl:imageUrl.value.trim(),date:new Date().toLocaleDateString("hi-IN"),createdAt:serverTimestamp()});
   title.value="";description.value="";imageUrl.value="";
   ok.textContent="खबर सफलतापूर्वक Publish हो गई।";ok.style.display="block";
  }catch(e){err.textContent="Publish failed: "+e.message;err.style.display="block"}
 };
}
</script></body></html>
